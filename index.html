<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>The Panama Bride</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f8f5f1;
      color: #1f1f1f;
    }

    .hero {
      height: 100vh;
      background-image:
        linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)),
        url('https://images.unsplash.com/photo-1519741497674-611481863552?q=80&w=1600&auto=format&fit=crop');

      background-size: cover;
      background-position: center;

      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;

      padding: 20px;
    }

    .hero-content {
      color: white;
      max-width: 700px;
    }

    h1 {
      font-size: 70px;
      margin-bottom: 20px;
      font-weight: 600;
    }

    p {
      font-size: 22px;
      line-height: 1.5;
      margin-bottom: 35px;
    }

    .btn {
      display: inline-block;
      padding: 16px 34px;
      background: #e7d7c9;
      color: #1f1f1f;
      text-decoration: none;
      border-radius: 50px;
      font-size: 18px;
      transition: 0.3s ease;
    }

    .btn:hover {
      background: white;
      transform: translateY(-2px);
    }

    @media(max-width: 768px) {

      h1 {
        font-size: 42px;
      }

      p {
        font-size: 18px;
      }

    }

  </style>

</head>

<body>

  <section class="hero">

    <div class="hero-content">

      <h1>The Panama Bride</h1>

      <p>
        Your modern guide to planning a beautiful wedding in Panama.
      </p>

      <a href="#" class="btn">
        Start Planning
      </a>

    </div>

  </section>

</body>
</html>
